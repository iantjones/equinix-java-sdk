                                            "quantity": "1",
                                            "unitPricing": [
                                                {
                                                    "value": "0.0",
                                                    "type": "NET_MONTHLY_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                }
                                            ],
                                            "requestType": "NO_CHANGE",
                                            "totalPricing": [
                                                {
                                                    "value": "0.0",
                                                    "type": "NET_MONTHLY_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                }
                                            ]
                                        },
                                        {
                                            "lineId": "1-2LCT0QQK",
                                            "parentLineId": "1-1ABC0DEV",
