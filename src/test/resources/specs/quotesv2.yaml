                    "termsOfUse": {
                        "type": "array",
                        "description": "Terms and conditions of quote such as initial term, renewal period and non-renewal notice. ",
                        "items": {
                            "$ref": "#/components/schemas/termsOfUse_Details"
                        }
                    },
                    "totalPricing": {
                        "type": "array",
                        "description": "Pricing details of grand total price",
                        "items": {
                            "$ref": "#/components/schemas/pricingDetails"
