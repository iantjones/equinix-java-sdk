    "info": {
        "version": "2.0",
        "title": "Quote APIs",
        "description": "Quote API allow users to retrieve detailed information about their Equinix quote. Users can use this API to get line level product and service pricing. In additional, users can also obtain important information such as quote expiry date and terms of use. Note that only quotes from the past 12 months will be returned.", 
        "termsOfService": "https://www.equinix.com/about/legal/terms",
        "contact": {
            "name": "Equinix API Support",
            "url": "https://docs.equinix.com/api-support.htm"
        }
    },
    "servers": [
        {
            "url": "https://api.equinix.com"
        },
        {
            "url": "https://sandboxapi.equinix.com"
        }
    ],
    "tags": [
        {
            "name": "Quote",
            "description": "Quote"
        }
    ],
    "paths": {
        "/v2/quotes/{quoteId}": {
            "get": {
                "tags": [
                    "Quote"
                ],
                "operationId": "Retrieve a quote",
                "summary": "Retrieve a quote",
                "description": "This method retrieves a specific quote by its ID for a user with appropriate viewing permission.",
                "security": [
                    {
                        "BearerAuth": []
                    }
                ],
                "parameters": [
                    {
                        "name": "quoteId",
                        "in": "path",
                        "description": "Identifier of the quote",
                        "required": true,
                        "style": "simple",
                        "explode": false,
                        "schema": {
                            "maximum": 100,
                            "minimum": 1,
                            "type": "string"
                        }
                    },
                    {
                        "name": "ibxs",
                        "in": "query",
                        "description": "List of IBXs to be filtered",
                        "required": false,
                        "style": "form",
                        "explode": false,
                        "schema": {
                            "type": "array",
                            "items": {
                                "type": "string"
                            }
                        },
                        "example": "SG1"
                    }
                ],
                "responses": {
                    "200": {
                        "description": "Ok",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/quote_response"
                                },
                                "example": {
                                    "quoteId": "1-100000000009",
                                    "accountName": "Company Name LLC",
                                    "accountNumber": "1000001",
                                    "quoteRequestType": "NEW",
                                    "contacts": [
                                        {
                                            "firstName": "John",
                                            "lastName": "Doe",
                                            "details": [
                                                {
                                                    "value": "johndoe@acme.com",
                                                    "type": "EMAIL"
                                                }
                                            ],
                                            "type": "QUOTATION"
                                        }
                                    ],
                                    "status": "APPROVED",
                                    "createdDateTime": "2020-11-12T19:07:21.000Z",
                                    "updatedDateTime": "2020-11-12T20:03:15.000Z",
                                    "expirationDateTime": "2021-02-10T00:00:00.000Z",
                                    "channel": "OFFLINE",
                                    "subChannel": "QUOTE",
                                    "currencyCode": "USD",
                                    "termsOfUse": [
                                        {
                                            "value": "36",
                                            "type": "INITIAL_TERM",
                                            "period": "MONTHS"
                                        },
                                        {
                                            "value": "12.0",
                                            "type": "RENEWAL_TERM",
                                            "period": "MONTHS"
                                        },
                                        {
                                            "value": "90.0",
                                            "type": "NON_RENEWAL_NOTICE",
                                            "period": "DAYS"
                                        }
                                    ],
                                    "totalPricing": [
                                        {
                                            "value": "0.0",
                                            "type": "MONTHLY_CHARGE",
                                            "valueType": "ABSOLUTE"
                                        },
                                        {
                                            "value": "0.0",
                                            "type": "ONE_TIME_CHARGE",
                                            "valueType": "ABSOLUTE"
                                        },
                                        {
                                            "value": "0.0",
                                            "type": "MONTHLY_DISCOUNT",
                                            "valueType": "ABSOLUTE"
                                        },
                                        {
                                            "value": "0.0",
                                            "type": "ONE_TIME_DISCOUNT",
                                            "valueType": "ABSOLUTE"
                                        }
                                    ],
                                    "versionNumber": "1",
                                    "details": [
                                        {
                                            "lineId": "1-1ABC0DEV",
                                            "parentLineId": null,
                                            "rootLineId": "1-1ABC0DEV",
                                            "ibx": "NY4",
                                            "productDescription": "Not Applicable",
                                            "cage": null,
                                            "productCode": "SPC00006.PROD",
                                            "productName": "Secure Cabinet With kVA Based Power",
                                            "assetizable": true,
                                            "lineItemModified": true,
                                            "quantity": "1",
                                            "unitPricing": [
                                                {
                                                    "value": "0.0",
                                                    "type": "NET_MONTHLY_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                }
                                            ],
                                            "requestType": "NO_CHANGE",
                                            "totalPricing": [
                                                {
                                                    "value": "0.0",
                                                    "type": "NET_MONTHLY_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                },
                                                {
                                                    "value": "0.0",
                                                    "type": "MONTHLY_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                },
                                                {
                                                    "value": "0.0",
                                                    "type": "ONE_TIME_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                }
                                            ]
                                        },
                                        {
                                            "lineId": "1-2LCT0QQL",
                                            "parentLineId": "1-1ABC0DEV",
                                            "rootLineId": "1-1ABC0DEV",
                                            "ibx": "NY4",
                                            "productDescription": "AC Power ( 30 kVA )",
                                            "cage": null,
