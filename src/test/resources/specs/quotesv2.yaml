                                            "lineItemModified": true,
                                            "quantity": "1",
                                            "unitPricing": [
                                                {
                                                    "value": "0.0",
                                                    "type": "NET_ONE_TIME_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                }
                                            ],
                                            "requestType": "NO_CHANGE",
                                            "totalPricing": [
                                                {
                                                    "value": "0.0",
                                                    "type": "NET_ONE_TIME_CHARGE",
                                                    "valueType": "ABSOLUTE"
                                                }
                                            ]
                                        }
                                    ]
                                }
                            }
                        }
                    },
                    "403": {
                        "description": "Forbidden",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "type": "array",
                                    "items": {
                                        "allOf": [
                                            {
                                                "$ref": "#/components/schemas/Error"
                                            }
                                        ]
                                    }
                                },
                                "example": [
                                    {
                                        "errorCode": "EQ-2010005",
                                        "errorMessage": "QuoteID not found for this account. Please ensure you have the appropriate permissions to view this quote",
                                        "correlationId": "99740129126918"
                                    }
                                ]
                            }
                        }
                    },
                    "500": {
                        "description": "Internal Server Error",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "type": "array",
                                    "items": {
                                        "allOf": [
                                            {
                                                "$ref": "#/components/schemas/Error"
                                            }
                                        ]
                                    }
                                },
                                "example": [
                                    {
                                        "errorCode": "EQ-2010101",
                                        "errorMessage": "The server has encountered an unexpected error. We apologize for the inconvenience. Please try again later.",
                                        "correlationId": "99740129126918"
                                    }
                                ]
                            }
                        }
                    }
                }
            }
        }
    },
    "components": {
        "securitySchemes": {
            "BearerAuth": {
                "type": "http",
                "scheme": "bearer",
                "bearerFormat": "JWT"
            }
        },
        "schemas": {
            "Error": {
                "title": "Error Info",
                "type": "array",
                "items": {
                  "title": "Error details",
                  "type": "object",
                  "properties": {
                    "errorCode": {
                      "type": "string",
                      "example": "EQ-20YYXXX"
                    },
                    "errorMessage": {
                      "type": "string",
                      "example": "Error message"
                    },
                    "details": {
                      "type": "string",
                      "example": "Error details"
                    },
                    "correlationId": {
                      "type": "string",
                      "example": "Correlation ID to trace the error back"
                    },
                    "help": {
                      "type": "string",
                      "example": "URL to a help page for the corresponding errorCode"
                    },
                    "additionalInfo": {
                      "title": "Error details",
                      "type": "object",
                      "properties": {
                        "property": {
                          "type": "string",
                          "example": "id"
                        },
                        "reason": {
                          "type": "string",
                          "example": "missing id"
                        }
                      }
                    }
                  }
                }
              },
            "quote_response": {
                "allOf": [
                    {
                        "$ref": "#/components/schemas/quote_response_base"
                    },
                    {
                        "properties": {
                            "details": {
                                "type": "array",
                                "description": "Quote details of line items",
                                "items": {
                                    "$ref": "#/components/schemas/quote_details"
                                }
                            }
                        }
                    }
                ]
            },
            "quote_response_base": {
                "type": "object",
                "properties": {
                    "quoteId": {
                        "type": "string",
                        "description": "Equinix quote ID. ",
                        "example": "1-1234567891011"
                    },
                    "accountName": {
                        "type": "string",
                        "description": "Customer account name",
                        "example": "AAA Corporation Ltd"
                    },
                    "accountNumber": {
                        "type": "string",
                        "description": "Customer account number",
                        "example": "123456"
                    },
                    "quoteRequestType": {
                        "type": "string",
                        "description": "The request type of the quote",
                        "enum": [
                            "NEW",
                            "AMENDMENT",
                            "PAPERWORK",
                            "REPLACEMENT_RENEWAL",
                            "TERMINATION",
                            "MIGRATION"
                        ]
                    },
                    "contacts": {
                        "type": "array",
                        "description": "The related party(ies) that are associated to the quote.",
                        "items": {
                            "$ref": "#/components/schemas/Contacts"
                        }
                    },
                    "status": {
                        "type": "string",
                        "enum": [
                            "SUBMITTED",
                            "APPROVED"
                        ],
                        "description": "The current status of the quote"
                    },
                    "createdDateTime": {
                        "type": "string",
                        "format": "date-time",
                        "description": "The quote created date and time in UTC timezone.",
                        "example": "2020-11-19T06:51:10.000Z"
                    },
                    "updatedDateTime": {
                        "type": "string",
                        "format": "date-time",
                        "description": "The quote updated date and time in UTC timezone.",
                        "example": "2020-11-20T06:51:10.000Z"
                    },
                    "expirationDateTime": {
                        "type": "string",
                        "format": "date-time",
                        "description": "The quote expiration date and time in UTC timezone. Quote will be invalid when `expirationDateTime` has passed.",
                        "example": "2020-12-31T06:51:10.000Z"
                    },
                    "channel": {
                        "type": "string",
                        "enum": [
                            "PORTAL",
                            "OFFLINE"
                        ],
                        "description": "The channel which quote was being requested."
                    },
                    "subChannel": {
                        "type": "string",
                        "enum": [
                            "QUOTE"
                        ],
                        "description": "The sub-channel which quote was being requested."
                    },
                    "customerReferenceId": {
                        "type": "string",
                        "description": "Customer Reference Number / External Reference Number",
                        "example": "048837d6-4cd8-401f-ba41-a4ac015c3f3e"
                    },
                    "agreementNumber": {
                        "type": "string",
                        "description": "Quote agreement number"
                    },
