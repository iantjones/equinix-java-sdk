            "quote_details": {
                "type": "object",
                "properties": {
                    "lineId": {
                        "type": "string",
                        "description": "Unique identifier associated with line item.",
                        "example": "1-NEYSNX123"
                    },
                    "parentLineId": {
                        "type": "string",
                        "description": "Unique identifier associated with `lineId` to denote hierarchy of the product. When this field is null, item is at root level.",
                        "example": "1-NEYSNX124"
                    },
                    "rootLineId": {
                        "type": "string",
                        "description": "Unique identifier to specify root item. Useful when product order hierarchy exceeds 2.",
                        "example": "1-NEYSNX120"
                    },
                    "ibx": {
                        "type": "string",
                        "description": "Location code of Equinix datacenter",
                        "example": "AM1"
                    },
                    "cage": {
                        "type": "string",
                        "description": "Cage ID",
                        "example": "DC2:01:001030"
                    },
                    "productDescription": {
                        "type": "string",
                        "description": "Description of the product. ",
                        "example": "Smart Hands Support Plan"
                    },
                    "productType": {
                        "type": "string",
                        "description": "Product type",
                        "enum": [
                            "CROSS_CONNECT",
                            "SMART_HANDS",
                            "WORK_VISIT",
                            "SECURITY_ACCESS",
                            "CONFERENCE_ROOM",
                            "TROUBLE_TICKET",
                            "SHIPMENTS",
                            "NETWORK_PORTS",
                            "DEINSTALL_CROSS_CONNECT",
                            "CLOUD_EXCHANGE_PORTS",
                            "OTHER"
                        ]
                    },
                    "productCode": {
                        "type": "string",
                        "description": "Equinix Product catalog code.",
                        "example": "PS00002.PROD"
                    },
                    "productName": {
                        "type": "string",
                        "description": "Product name",
                        "example": "Smart Hands Support Plan"
                    },
                    "assetizable": {
                        "type": "boolean",
                        "description": "When this value is `true`, line item is assetizable."
                    },
                    "lineItemModified": {
                        "type": "boolean",
                        "description": "When this value is `true`, it means there are changes to POE."
                    },
                    "quantity": {
                        "type": "number",
                        "description": "The total amount of quantity bought. To be used with `unitOfMeasure` to derive value",
                        "example": 20
                    },
                    "unitOfMeasure": {
                        "type": "string",
                        "description": "Metric of `quantity`",
                        "example": "HRS",
                        "enum": [
                            "CAB",
                            "EACH",
                            "MBP",
                            "KVA",
                            "GB",
                            "HRS",
                            "SFT",
                            "LF",
                            "KWH"
                        ]
                    },
                    "unitPricing": {
                        "type": "array",
                        "items": {
                            "$ref": "#/components/schemas/pricingDetails"
                        }
                    },
                    "totalPricing": {
                        "type": "array",
                        "items": {
                            "$ref": "#/components/schemas/pricingDetails"
                        }
                    },
                    "requestType": {
                        "type": "string",
                        "description": "Type of order request. For example, requestType can be of ADD if you are adding new services/product.",
                        "enum": [
                            "ADD",
                            "DELETE",
                            "UPDATE",
                            "NO_CHANGE"
                        ]
                    },
                    "additionalInfo": {
                        "type": "array",
                        "description": "This section is reserved to display product specific information",
                        "items": {
                            "type": "object",
                            "properties": {
                                "key": {
                                    "type": "string"
                                },
                                "value": {
                                    "type": "string"
                                }
                            }
                        }
                    }
                }
            },
            "termsOfUse_Details": {
                "type": "object",
                "properties": {
                    "value": {
                        "type": "integer",
                        "description": "Denotes the value of period"
                    },
                    "period": {
                        "type": "string",
                        "description": "Denotes the period type",
                        "enum": [
                            "MONTHS",
                            "DAYS"
                        ]
                    },
                    "type": {
                        "type": "string",
                        "description": "Type of quote terms",
                        "enum": [
                            "INITIAL_TERM",
                            "RENEWAL_TERM",
                            "NON_RENEWAL_NOTICE"
                        ]
                    }
                }
            },
            "pricingDetails": {
                "title": "Pricing Details",
                "description": "Pricing details for a particular service or product. This can be of recurring and non-recurring charges. ",
                "type": "object",
                "properties": {
                    "value": {
                        "type": "number",
                        "description": "To be used with `valueType` and `type`. Can be used to denote price or discount for an order or service",
                        "example": "100"
                    },
                    "valueType": {
                        "type": "string",
                        "description": "To indicate if `value` is of absolute or percentage value. i.e Use `ABSOLUTE` for $50 or `PERCENTAGE` for 50%",
                        "enum": [
                            "ABSOLUTE",
                            "PERCENTAGE"
                        ]
                    },
                    "type": {
                        "type": "string",
                        "description": "To indicate the type of `value` and `valueType.",
                        "enum": [
                            "ONE_TIME_CHARGE",
                            "MONTHLY_CHARGE",
                            "MONTHLY_DISCOUNT",
                            "ONE_TIME_DISCOUNT",
                            "NET_MONTHLY_CHARGE",
                            "NET_ONE_TIME_CHARGE",
                            "TAX"
                        ]
                    }
                }
            },
            "Contacts": {
                "type": "object",
                "properties": {
                    "registeredUser": {
                        "type": "string",
                        "description": "Username of a registered user.",
                        "example": "john_doe"
                    },
                    "firstName": {
                        "type": "string",
                        "description": "First name of the contact.",
                        "example": "John"
                    },
                    "lastName": {
                        "type": "string",
                        "description": "Last name of the contact.",
                        "example": "Doe"
                    },
                    "type": {
                        "type": "string",
                        "description": "contact type",
                        "enum": [
                            "QUOTATION",
                            "SUPPLIER"
                        ]
                    },
                    "details": {
                        "type": "array",
                        "description": "Reference of the related party, could be a party reference or a party role reference",
                        "items": {
                            "$ref": "#/components/schemas/ContactsDetails"
                        }
                    }
                },
                "description": "Contact information."
            },
            "ContactsDetails": {
                "type": "object",
                "properties": {
                    "type": {
                        "type": "string",
                        "description": "Communications Type ",
