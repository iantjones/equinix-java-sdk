    AccessPolicy:
      title: UserAccessPolicyData
      description: A set of permissions that is granted to principals, groups, or other projects.
      type: object
      properties:
        description:
          type: string
          pattern: ^.{0,500}$
          example: A description string.
        tags:
          $ref: '#/components/schemas/Tags'
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
        permissions:
          $ref: '#/components/schemas/UserRectSet'
        createdBy:
          $ref: '#/components/schemas/CreatedBy'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        rev:
          $ref: '#/components/schemas/ResourceRev'
        approvedAt:
          $ref: '#/components/schemas/UpdatedAt'
        ern:
          $ref: '#/components/schemas/Ern'
        disabledPolicy:
          enum:
