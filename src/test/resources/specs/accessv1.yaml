                            results from this permission object.
          allOf:
          - {}
          - $ref: '#/components/schemas/UserRectSet'
        subtract:
          description: |-
            Entries in the `subtract` field are not included in the results from this permission
                           object.
          type: array
          items:
            $ref: '#/components/schemas/InlinePermission'
          uniqueItems: true
        allowBadRefs:
          description: |-
            Indicates that the access policy should be updated even if it includes
                                            invalid references to permission objects. Setting to "existing" will allow existing
                                            invalid references to remain, but will complain if new invalid references are
                                            introduced. Setting to "additional" will allow both existing and new invalid
                                            references to be accepted without complaint.
          type: string
          enum:
          - existing
          - additional
          example: additional
        lastRev:
          $ref: '#/components/schemas/LastResourceRev'
