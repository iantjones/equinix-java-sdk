tags:
- name: v1-access-policy
  x-displayName: Access Policy
  description: Operations for managing Access Policies
- name: v1-permission-set
  x-displayName: Permission Set
  description: Operations for managing Permission Sets
- name: v1-role
  x-displayName: Role
  description: Operations for viewing Roles available for assignment
- name: v1-role-assignment
  x-displayName: Role Assignment
  description: Operations for manging Role Assignments
- name: v1-principal-policy
  x-displayName: Principal Policy
  description: Operations for managing Principal Policies
- name: v1-policy-mask
  x-displayName: Policy Mask
  description: Operations for managing Policy Masks
- name: v1-misc
  x-displayName: Misc
  description: Operations for viewing Access-related information for a project
security:
- bearerAuth: []
externalDocs:
  url: https://docs.equinix.com/iam/attribute-based-access-control/access-policies
  description: Access Service Documentation
paths:
  /v1/projects/{projectId}/permissionSets:
    get:
      operationId: listPermissionSets
      summary: List Permission Sets
      tags:
      - v1-permission-set
      description: |-
        Allows a user to page through all of the permission sets within a project. The project is identifed by the
           `projectId`. Access to this operation is controlled by the project being accessed.

        The auth token's access policy must allow `action:use/listPermissionSets`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSetList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPermissionSet
      summary: Create Permission Set
      tags:
      - v1-permission-set
      description: |-
        Allows users to define a permission set object which can then be used as a reusable building block when defining
           access policies.  The permission set is created in the project identified by the `projectId`. A
           permission set is conceptually a set of action/resource tuples. The set is computed based on the `permissions`,
           `intersect`, and `subtract` fields. Each of those fields is a unioned composite and are then combined by taking the
           `permissions` tuples, intersected with the `intersect` tuples, and then from that the `subtract` tuples are
           removed. Access to this operation is controlled by the project being accessed.

        The auth token's access policy must allow `action:use/createPermissionSet`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionSetBody'
  /v1/projects/{projectId}/accessPolicies/{accessPolicyId}/grants:
    get:
      operationId: listGrants
      summary: List Grants
      tags:
      - v1-access-policy
      description: |-
        Allows a user to page through the external grants of an access policy including a managed policy. Access to this
          operation is controlled by the access policy being accessed.

        The auth token's access policy must allow `action:use/listGrants`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value. Use `*` here to indicate that accessPolicyId is an ERN.
        required: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/ProjectId'
          - title: '*'
            description: Indicates the resource is specified as an ERN in other input field.
            type: string
            enum:
            - '*'
      - name: accessPolicyId
        in: path
        description: |2-

          Callers may URL encode this value. When passing an ERN, callers *must* URL encode this value.
        required: true
        schema:
          oneOf:
          - oneOf:
            - $ref: '#/components/schemas/AccessPolicyId'
            - $ref: '#/components/schemas/ManagedPolicyId'
          - $ref: '#/components/schemas/Ern'
      - description: Opaque token identifying the page of results to retrieve.
        name: pageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - description: Maximum number of results to return per page.
        name: pageSize
        in: query
        required: false
        schema:
          default: 500
          $ref: '#/components/schemas/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyGrantList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: addGrant
      summary: Add Grant
      tags:
      - v1-access-policy
      description: |-
        Allows a user to add an external grant to an access policy including a managed policy. Access to this operation is
          controlled by the access policy being accessed.

        The auth token's access policy must allow `action:use/addGrant`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value. Use `*` here to indicate that accessPolicyId is an ERN.
        required: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/ProjectId'
          - title: '*'
            description: Indicates the resource is specified as an ERN in other input field.
            type: string
            enum:
            - '*'
      - name: accessPolicyId
        in: path
        description: |2-

          Callers may URL encode this value. When passing an ERN, callers *must* URL encode this value.
        required: true
        schema:
          oneOf:
          - oneOf:
            - $ref: '#/components/schemas/AccessPolicyId'
            - $ref: '#/components/schemas/ManagedPolicyId'
          - $ref: '#/components/schemas/Ern'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyGrant'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGrantBody'
  /v1/roleAssignments/{roleAssignmentId}:
    get:
      operationId: getRoleAssignment
      summary: Get Role Assignment
      tags:
      - v1-role-assignment
      description: |-
        Get a RoleAssignment by its id. For an Access Policy token, the
          RoleAssignment's assignmentScope must be at or below the project (if
          given, otherwise the project that owns the Access Policy) For a Role
          Assignment token, the RoleAssignment must be visible by the user and the
          project args are unsupported.

        The auth token's access policy must allow `action:use/getRoleAssignment`.
      parameters:
      - name: roleAssignmentId
        in: path
        description: |-
          Uniquely identifies an access policy within a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/RoleAssignmentId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteRoleAssignment
      summary: Delete Role Assignment
      tags:
      - v1-role-assignment
      description: |-
        Delete an existing RoleAssignment, thereby removing the permissions granted to the principal by the given Role.

        The auth token's access policy must allow `action:use/deleteRoleAssignment`.
      parameters:
      - name: roleAssignmentId
        in: path
        description: |-
          Uniquely identifies an access policy within a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/RoleAssignmentId'
      responses:
        '204':
          description: Success
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/principalPolicies:
    get:
      operationId: listPrincipalPolicies
      summary: List Principal Policies
      tags:
      - v1-principal-policy
      description: |-
        Allows an admin to list principal policies in a project with pagination. Access to this
           operation is controlled by the project. Includes disabled policies so admins can re-enable them.

        The auth token's access policy must allow `action:use/listPrincipalPolicies`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      - description: Opaque token identifying the page of results to retrieve.
        name: pageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - description: Maximum number of results to return per page.
        name: pageSize
        in: query
        required: false
        schema:
          default: 100
          $ref: '#/components/schemas/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPolicyList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/servicePolicySchemas:
    get:
      operationId: getServicePolicySchema
      summary: Get Service Policy Schema
      tags:
      - v1-misc
      description: |-
        Allows a user to retrieve the Cedar schema for the given service, in JSON representation. The Cedar schema describes
          the attributes and resource types that can be referenced in access policy conditions for each action of the
          service. Access is controlled based on the project identified by `projectId`.

        The auth token's access policy must allow `action:use/getServicePolicySchema`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      - description: Fully qualified, universally unique id of a service.
        name: serviceId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ServiceId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePolicySchema'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/actions:
    get:
      operationId: listActions
      summary: List Actions
      tags:
      - v1-misc
      description: |-
        Allows a user to page through the actions defined for a given `serviceId`. This allows users to discover what actions
          are available to be used when defining access policies.  Access to this is operation is controlled by
          the project specified by `projectId`.  The results are filtered
          according to the service mask of that same project. The results will include actions from all of the
          aspects which are accessible based on the service mask. When the service mask does not allow any access to the
          service an exception is thrown.

        The auth token's access policy must allow `action:use/listActions`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      - description: Fully qualified, universally unique id of a service.
        name: serviceId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ServiceId'
      - description: Opaque token identifying the page of results to retrieve.
        name: pageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - description: Maximum number of results to return per page.
        name: pageSize
        in: query
        required: false
        schema:
          default: 100
          $ref: '#/components/schemas/PageSize'
      - description: Equinix Resource Name of a project. Mutually exclusive with projectId.
        name: projectErn
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ern'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/projects/{projectId}/policyMasks/{policyMaskId}/disable:
    post:
      operationId: disablePolicyMask
      summary: Disable Policy Mask
      tags:
      - v1-policy-mask
      description: |-
        Allows a user to disable a project-scoped policy mask. A disabled mask is treated as absent
           during policy mask resolution. Access is controlled by the mask.

        The auth token's access policy must allow `action:use/disablePolicyMask`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value. Use `*` here to indicate that policyMaskId is an ERN.
        required: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/ProjectId'
          - title: '*'
            description: Indicates the resource is specified as an ERN in other input field.
            type: string
            enum:
            - '*'
      - name: policyMaskId
        in: path
        description: |-
          Uniquely identifies a policy mask globally or within a governing project.
          Callers may URL encode this value. When passing an ERN, callers *must* URL encode this value.
        required: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/PolicyMaskId'
          - $ref: '#/components/schemas/Ern'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMask'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LastRevBody'
  /v1/projects/{projectId}/principalPolicies/{userPrincipal}/disable:
    post:
      operationId: disablePrincipalPolicy
      summary: Disable Principal Policy
      tags:
      - v1-principal-policy
      description: |-
        Disables a principal policy in a project by user principal. Disabling a principal policy means
           it will not be available for use by the principal and will appear as if it does not exist via
           access-use APIs. Access to this operation is controlled at the project level.

        The auth token's access policy must allow `action:use/disablePrincipalPolicy`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      - name: userPrincipal
        in: path
        description: |-
          Globally unique string identifier for a principal formatted like "principal:...".
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/Principal'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPolicy'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LastRevBody'
  /v1/projects/{projectId}/accessPolicies:
    get:
      operationId: listAccessPolicies
      summary: List Access Policies
      tags:
      - v1-access-policy
      description: |-
        Allows a user to page through all of the access policies within a project. The project is identified by
           `projectId`. Access to this operation is controlled by the project being accessed.

        The auth token's access policy must allow `action:use/listAccessPolicies`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAccessPolicy
      summary: Create Access Policy
      tags:
      - v1-access-policy
      description: |-
        Allows a user to create a new access policy. The access policy is created in the project identified by the
           `projectId`. An access policy contains that same data as a permission set but also includes the `grants`
           field for indicating what principals can use the access policy. Access to this operation is controlled by the project
           being accessed.

        The auth token's access policy must allow `action:use/createAccessPolicy`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessPolicyBody'
  /v1/projects/{projectId}/principalPolicies/{userPrincipal}/enable:
    post:
      operationId: enablePrincipalPolicy
      summary: Enable Principal Policy
      tags:
      - v1-principal-policy
      description: |-
        Enables a principal policy in a project by user principal. This reverses the effect of
           disabling a principal policy. Access to this operation is controlled at the project level.

        The auth token's access policy must allow `action:use/enablePrincipalPolicy`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/ProjectId'
      - name: userPrincipal
        in: path
        description: |-
          Globally unique string identifier for a principal formatted like "principal:...".
          Callers may URL encode this value.
        required: true
        schema:
          $ref: '#/components/schemas/Principal'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalPolicy'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LastRevBody'
  /v1/roleAssignments:
    get:
      operationId: listRoleAssignments
      summary: List Role Assignments
      tags:
      - v1-role-assignment
      description: |-
        Get a page of all the RoleAssignments for the given assignment scope.

        The auth token's access policy must allow `action:use/listRoleAssignments`.
      parameters:
      - description: Opaque token identifying the page of results to retrieve.
        name: pageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PageToken'
      - description: Maximum number of results to return per page.
        name: pageSize
        in: query
        required: false
        schema:
          default: 100
          $ref: '#/components/schemas/PageSize'
      - description: Id of the object this assignment scope refers to
        name: assignmentScopeId
        in: query
        required: true
        schema:
          description: Id of the object this assignment scope refers to
          type: string
          example: 07218c48-343d-43e2-9831-a2080445cd22
      - description: Type of object that defines the scope of a role assignment (e.g. PROJECT, ORGANIZATION).
        name: assignmentScopeType
        in: query
        required: true
        schema:
          description: Type of object that defines the scope of a role assignment (e.g. PROJECT, ORGANIZATION).
          type: string
          example: PROJECT
          examples:
          - PDS_ORG
          - ORGANIZATION
          - PROJECT
          - BILLING_ACCOUNT
          - SUBSCRIPTION_KEY
          - PORT
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createRoleAssignment
      summary: Create Role Assignment
      tags:
      - v1-role-assignment
      description: |-
        Create a new RoleAssignment, thereby granting the principal the permissions defined by the given Role.

        The auth token's access policy must allow `action:use/createRoleAssignment`.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
