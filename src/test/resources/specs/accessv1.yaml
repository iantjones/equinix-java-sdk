            Entries must appear in both the `intersect` field and the `permissions` to be in the
                            results from this permission object.
          allOf:
          - {}
          - $ref: '#/components/schemas/UserRectSet'
        subtract:
          description: |-
            Entries in the `subtract` field are not included in the results from this permission
                           object.
          type: array
          items:
            $ref: '#/components/schemas/InlinePermission'
          uniqueItems: true
        accessPolicyId:
          oneOf:
          - $ref: '#/components/schemas/AccessPolicyId'
          - $ref: '#/components/schemas/ManagedPolicyId'
        approvedBy:
          $ref: '#/components/schemas/ApprovedBy'
      required:
