    LastResourceRev:
      description: |-
        An opaque string that represents the expected revision of a given resource. This is provided when a resource is
          updated so that if a concurrent update has occurred since the resource was read, then the collision will be detected.
      type: string
      minLength: 1
      maxLength: 256
