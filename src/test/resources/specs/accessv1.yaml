      - permissions
      - lastRev
      additionalProperties: false
    CageId:
      description: Identifies an Equinix colocation cage within an IBX (e.g. SV1:cage-1).
      type: string
      pattern: ^[A-Z]{2}[0-9A-Z]{1,5}x?:[a-zA-Z0-9:_.-]{1,50}$
      example: SV1:cage-1
    EffectivePermissions:
      description: The effective permissions granted to a principal within a project for a service.
      type: object
      properties:
        principalId:
          $ref: '#/components/schemas/Principal'
        projectId:
          $ref: '#/components/schemas/ProjectId'
        serviceId:
          $ref: '#/components/schemas/ServiceId'
        accessPolicyIds:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/AccessPolicyId'
            - $ref: '#/components/schemas/ManagedPolicyId'
          uniqueItems: true
          minItems: 1
        permissions:
          type: array
          items:
            description: The caller has permission to perform any of the given actions. The resources field, when present, indicates that the actions apply only to the referenced resources (or any *except* the referenced resources). The condition field, when present, indicates that the actions apply only when the condition is true.
            type: object
            properties:
              actions:
                description: A set of actions the caller is permitted to perform.
                type: array
                items:
                  $ref: '#/components/schemas/ActionId'
                uniqueItems: true
              resources:
                anyOf:
                - description: A specific set of resources on which the actions may be performed.
                  type: array
                  items:
                    $ref: '#/components/schemas/Ern'
                  uniqueItems: true
                - description: A specific set of resources in this project, on which this permission block does not apply.
                  type: object
                  properties:
                    except:
                      type: array
                      items:
                        $ref: '#/components/schemas/Ern'
                      uniqueItems: true
                  required:
                  - except
                  additionalProperties: false
              metroCodes:
                anyOf:
                - description: A specific set of metro codes on which the actions may be performed.
                  type: array
                  items:
                    $ref: '#/components/schemas/MetroCode'
                  uniqueItems: true
                - description: 'A specific set of metro codes on which the actions may *not* be performed. '
                  type: object
                  properties:
                    except:
                      type: array
                      items:
                        $ref: '#/components/schemas/MetroCode'
                      uniqueItems: true
                  required:
                  - except
                  additionalProperties: false
              ibxIds:
                anyOf:
                - description: A specific set of ibx ids on which the actions may be performed.
                  type: array
                  items:
                    $ref: '#/components/schemas/IbxId'
                  uniqueItems: true
                - description: 'A specific set of ibx ids on which the actions may *not* be performed. '
                  type: object
                  properties:
                    except:
                      type: array
                      items:
                        $ref: '#/components/schemas/IbxId'
                      uniqueItems: true
                  required:
                  - except
                  additionalProperties: false
              cageIds:
                anyOf:
                - description: A specific set of cage ids on which the actions may be performed.
                  type: array
                  items:
                    $ref: '#/components/schemas/CageId'
                  uniqueItems: true
                - description: 'A specific set of cage ids on which the actions may *not* be performed. '
                  type: object
                  properties:
                    except:
                      type: array
                      items:
                        $ref: '#/components/schemas/CageId'
                      uniqueItems: true
                  required:
                  - except
                  additionalProperties: false
              condition:
                description: A Cedar policy language expression that must be true for the actions to be performed.
                type: string
                example: context.myAttribute < 5
            required:
            - actions
            additionalProperties: false
          uniqueItems: true
      required:
      - principalId
      - projectId
      - serviceId
      - permissions
      additionalProperties: false
