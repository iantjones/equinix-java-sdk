      - permissions
      - lastRev
      additionalProperties: false
    PolicyMaskId:
      description: Uniquely identifies a policy mask globally or within a governing project.
      type: string
      pattern: ^policymask:[a-zA-Z](?![^:]*-$)(?![^:]*--)[a-zA-Z0-9-]{0,49}$
      example: policymask:my-mask
