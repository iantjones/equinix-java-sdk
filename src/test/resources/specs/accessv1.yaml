  /v1/projects/{projectId}/effectivePermissions:
    get:
      operationId: getEffectivePermissions
      summary: Get Effective Permissions
      tags:
      - v1-misc
      description: |-
        Returns a unified representation of the caller's permissions for a given service,
           based on the supplied access token.
           A user in possession of a valid access token is always authorized to perform this operation.
           There is no corresponding action id, because permission to perform the operation does not depend
           on the role assignments or access policy of the caller.

           Permissions are always returned in the context of a specific project.
           When a project id is not supplied, permissions are returned for the project containing access
           policy in the access token's scope. When the access token is not associated with an access policy,
           a project id must be specified.

        The auth token's access policy must allow `action:use/getEffectivePermissions`.
      parameters:
      - name: projectId
        in: path
        description: |-
          Globally unique identifier of a project.
