      - accessPolicyId
      additionalProperties: false
    Ern:
      description: |-
        Equinix resource name, a universally unique identifier for a resource across all clouds, regions, and
          services. Formatted as
          "ern:&lt;cloudId&gt;:&lt;serviceId&gt;:&lt;regionId&gt;:&lt;projectId&gt;:&lt;resourceType&gt;:&lt;resourceId&gt;".
      type: string
      pattern: ^ern:(?<cloud>[^:]{1,50}):(?<service>[^:/]{1,50}/[^:/]{1,50}):(?<region>[^:]{1,50}):(?<project>[^:]{1,36}):(?<resourcetype>[^:]{1,50}):(?<resource>[^:]{1,50})$
      example: ern:eqix:equinix/sts:global:abc-123:SomeType:res-id
    ResourceRev:
      description: |-
        An opaque string that represents the revision of a given resource. Each time the resource is updated, this value
          changes.
      type: string
      pattern: ^.*$
      example: abc123
    PageToken:
      description: When paging through results, the PageToken is an opaque indicator that identifies a page.
      type: string
      minLength: 1
      maxLength: 4096
      example: eyJwYWdlIjoyfQ==
    IbxLocationCondition:
      description: |-
        A condition that limits permissible actions according to location, by Metro, IBX, or cage.
          The values supplied in this condition are OR'd together: matching any one supplied attribute
          is sufficient to allow the action.

          Each condition is compared with the action's attribute; if the action doesn't
          provide a value, the condition is compared with the target resource's attribute.
          If neither source provides the attribute, that condition contributes no restriction.

          Location values that broadly cover more specific ones are not accepted. For example:
          - If metroCodes contains 'NY', then ibxIds must not contain 'NY5'
            (since NY already includes all IBXs in New York)
          - If ibxIds contains 'NY5', then cageIds must not contain 'NY5:ABC123'
            (since NY5 already includes all cages in that IBX)
      type: object
      properties:
        metroCodes:
          type: array
          items:
            $ref: '#/components/schemas/MetroCode'
          uniqueItems: true
          minItems: 1
          maxItems: 50
        ibxIds:
          type: array
          items:
            $ref: '#/components/schemas/IbxId'
          uniqueItems: true
          minItems: 1
          maxItems: 50
        cageIds:
          type: array
          items:
            $ref: '#/components/schemas/CageId'
          uniqueItems: true
          minItems: 1
          maxItems: 50
      additionalProperties: false
    Tags:
      description: Additional user-controlled data about this resource.
      type: object
      additionalProperties:
        type: string
        pattern: ^.{0,120}$
        example: my tag value
      maxProperties: 10
    UpdateAccessPolicyBody:
      title: UserAccessPolicyData
      description: Request body for updating an access policy.
      type: object
