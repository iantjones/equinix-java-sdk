    ContactRequestRegisteredUser:
      required:
        - registeredUsers
        - type
      type: object
      properties:
        registeredUsers:
          type: array
          maxItems: 10
          description: "Username of a registered user."
          items:
            type: string
            example: john_doe
        type:
          $ref: '#/components/schemas/TypeOfTheContact'
      description: 'Contact information of a registered user. Ensure that the user status of this contact is approved, active or locked.'
    ContactRequestNonRegisteredUser:
      required:
        - details
        - type
      type: object
      properties:
        firstName:
          $ref: '#/components/schemas/FirstNameOfTheContact'
        lastName:
          $ref: '#/components/schemas/LastNameOfTheContact'
        type:
          $ref: '#/components/schemas/TypeOfTheContact'
        details:
          type: array
          minItems: 2
          maxItems: 3
          description: 'Reference of the related party, could be a party reference or a party role reference.'
          items:
            $ref: '#/components/schemas/ContactsRequestDetails'
      description: 'Contact information of a non-registered contact, including contact details.'
    ContactsRequestDetails:
      required:
        - type
        - value
      type: object
      properties:
        type:
          type: string
          description: 'Communication type.'
          example: PHONE
          enum:
            - EMAIL
            - MOBILE
            - PHONE
        value:
          type: string
          description: 'Unique identifier of related type.'
          example: +1-4601231122
      description: 'Contact details.'
    TypeOfTheContact:
      type: string
      example: 'NOTIFICATION'
      description: 'Type of the contact.'
      enum:
        - NOTIFICATION
        - ORDERING
        - TECHNICAL
    FirstNameOfTheContact:
      type: string
      example: 'John'
      description: 'First name of the contact.'
    LastNameOfTheContact:
      type: string
      example: 'Don'
      description: 'Last name of the contact.'
    Attachment:
      type: object
      description: "Attachment refers to extensions or additional parts that is or may be attached to something (agreements, contracts, appointments) to perform a particular function. They can be communication attachments, documents and other."
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
          example: "c77c5f58-a7ea-4e88-9fc4-1a2900027425"
          description: "Identifier of the binary attachment UUID."
        name:
          type: string
          minLength: 5
          maxLength: 100
          example: "error-log"
          description: "Name of the binary attachment."
        source:
          type: string
          enum:
            - "CUSTOMER"
            - "EQUINIX"
          example: "CUSTOMER"
          description: "Source of the binary attachment."
    Attachments:
      type: array
      minItems: 0
      maxItems: 5
      description: "File(s) attached to the trouble ticket. e.g. picture of broken device, scanning of a bill or charge, etc..."
      items:
        $ref: '#/components/schemas/Attachment'
    EmailId:
      type: string
      minLength: 18
      maxLength: 18
      example: "02s7z00000D30lZAAR"
      description: "Identifier of the email."
    Emails:
      type: array
      minItems: 0
      description: "Email conversation(s) attached to the ticket. e.g. email conversation with a technician, email conversation with a customer, etc..."
      items:
        $ref: '#/components/schemas/Email'
    Email:
      type: object
      description: "Email conversation attached to the ticket. e.g. email conversation with a technician, email conversation with a customer, etc..."
      properties:
        id:
