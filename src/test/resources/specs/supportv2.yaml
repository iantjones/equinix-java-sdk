                example: "Ali"
                description: "First name of the contact person."
              lastName:
                type: string
                example: "Mhn"
                description: "Last name of the contact person."
              localName:
                type: string
                example: "Ali Local"
                description: "Full name of contact person in local language."
              details:
                type: array
                items:
                  type: object
                  required:
