      maxLength: 8
      minLength: 8
      type: string
      description: 'Case number.'
      example: '11150929'
    OrderNumber:
      maxLength: 100
      minLength: 14
      type: string
      description: 'Order number.'
      example: '1-204976070710'
    CaseOrOrderNumber:
      type: string
      minLength: 8
      maxLength: 100
      example: "ex: 11150929 or 1-204976070710"
      description: "Case or order number."
    StatusResponse:
          type: string
          example: 'IN_PROGRESS'
          description: 'Case status.'
          enum:
            - SUBMITTED
            - IN_PROGRESS
            - RESOLVED
            - ACTION_REQUIRED
            - CLOSED
            - CANCELLED
    ContactResponse:
      type: object
      properties:
        firstName:
          $ref: '#/components/schemas/FirstNameOfTheContact'
        lastName:
          $ref: '#/components/schemas/LastNameOfTheContact'
        type:
          $ref: '#/components/schemas/TypeOfTheContact'
        details:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: 'EMAIL'
                description: 'Communication type.'
                enum:
                  - EMAIL
                  - MOBILE
                  - PHONE
              value:
                type: string
                example: 'SomeContact@email.com'
                description: 'Corresponding value according to the Communication Type.'
    SingleCaseResponseV2:
      title: Get a Case by Case or Order Number Response
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CaseOrOrderNumber'
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        accountName:
          $ref: '#/components/schemas/AccountName'
        customerReferenceId:
          type: string
          example: 'EESkFTupLmnF6KinbARfNgWAC2V1BZbDZKluF5TI5YVTXTfGkF'
          description: 'Additional information for customer to reference.'
        channel:
          type: string
          example: 'PORTAL'
          enum:
            - OFFLINE
            - PORTAL
          description: 'Channel through which the case was created.'
        orderId:
          $ref: '#/components/schemas/OrderNumber'
        location:
          type: object
          properties:
            ibx:
              type: array
              items:
                type: string
                description: 'IBX'
                example: 'SV5'
              description: 'IBX location(s).'
        status:
          $ref: '#/components/schemas/StatusResponse'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactResponse'
          description: "Contacts"
        notes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "ID of the note"
              createdDateTime:
                $ref: "#/components/schemas/Datetime"
              text:
                type: string
                description: "The content of the note."
                example: "This is a note."
              type:
                type: string
                description: "The type of the note."
                enum:
                  - RESOLUTION_NOTES
                  - CUSTOMER_NOTES
                example: "RESOLUTION_NOTES"
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachments'
        email:
          type: array
          items:
            $ref: '#/components/schemas/Emails'
        createdDateTime:
          $ref: '#/components/schemas/Datetime'
        otherDetails:
          type: object
          properties:
            contactUCMID:
              type: string
              example: '236284'
            recordType:
              type: string
              example: 'ECM'
              enum:
                - ECM
                - GSD Case
            subChannel:
              type: string
              example: 'ECP'
              enum:
                - ECP
            finalScheduledDate:
              $ref: '#/components/schemas/Datetime'
            category:
              type: string
              example: 'Trouble Services'
            subCategory:
              type: string
              example: 'Incident'
            description:
              type: string
              example: 'Sample description.'
            updatedDateTime:
              $ref: '#/components/schemas/Datetime'
            updatedByFullName:
              type: string
              example: '0052H000003iLJjQAM'
            requestedTerminationDate:
              type: string
              example: "2026-09-01"
              format: date
            statusHistory:
              type: array
              items:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/StatusResponse'
                  createdDate:
                    $ref: '#/components/schemas/Datetime'
            purchaseOrders:
              type: array
              items:
                type: string
                example: 'PO.1234'
            products:
              type: array
              items:
                type: string
                example: 'SMART_HANDS'
            productOfferingCodes:
              type: array
              items:
                type: string
                example: 'PS00001.PROD'
            details:
              type: array
              items:
                type: object
                properties:
                  lineId:
                    type: string
                    example: '1-2RCPXBUV'
                  parentLineId:
                    type: string
                    example: '1-2RCPXBUK'
                  productType:
                    type: string
                    example: 'SMART_HANDS'
                    enum:
                      - SMART_HANDS
                  productOfferingCode:
                    type: string
                    example: 'PS00001.PROD'
                  productCode:
                    type: string
                    example: 'PS00040.ELEM'
                  productName:
                    type: string
                    example: 'Other'
                  status:
                    type: string
                    example: 'SUBMITTED'
                    enum:
                      - IN_PROGRESS
                      - CANCELLED
                      - SUBMITTED
                      - CLOSED
                      - ACTION_REQUIRED
                      - RESOLVED
                  reOpen:
                    type: string
                    example: 'NOT_ALLOWED'
                  respond:
                    type: boolean
                    example: true
                  ibx:
                    type: string
                    example: 'DA3'
                  cage:
                    type: string
                    example: 'DA3:01:010315'
                  requestType:
                    type: string
                    example: 'ADD'
                    enum:
                      - ADD
                  activityId:
                    type: string
                    example: '3-216270588333'
                  purchaseOrder:
                    type: object
                    example: {}
                  estimatedCompletion:
                    type: object
                    properties:
                      originalDateTime:
                        type: string
                        example: "2023-08-29T04:01:43.000Z"
                        format: date-time
                  updatedDateTime:
                    type: string
                    example: "2023-08-29T04:01:43.000Z"
                    format: date-time
                  additionalInfo:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: 'IS_RECURRING'
                        value:
                          type: boolean
                          example: true
                  modifiable:
                    type: boolean
                    example: false
                  cancellable:
                    type: boolean
                    example: true
            additionalInfo:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                    example: 'RECURRING_TYPE'
                  value:
                    type: string
                    example: 'CHILD'
            modifiable:
              type: boolean
              example: false
            reOpen:
              type: boolean
              example: false
            cancellable:
              type: boolean
              example: true
            respond:
              type: boolean
              example: true
    ModifyCase:
      title: Modify Case Request Payload
      required:
        - text
      type: object
      properties:
        text:
          maxLength: 4000
          minLength: 1
          type: string
          description: 'Enter any modification details/additional notes to the technician.'
          example: 'This is a notes!'
        attachments:
          $ref: '#/components/schemas/Attachments'
    ModifyCaseResponse:
      title: Modify Case Request Response
      required:
        - result
      type: object
      properties:
        result:
          type: object
          description: 'Result of the modification request.'
          properties:
            caseId:
              type: string
              example: '5007i00000AUPOIAA5'
            caseNotesId:
              type: string
              example: 'a067i000007miaAAAQ'
            caseNumber:
              $ref: '#/components/schemas/CaseNumber'
    ModifyTicketResponse:
      title: Modify Ticket Request Response
      type: object
      properties:
        ticketId:
          $ref: '#/components/schemas/CaseOrOrderNumber'
        success:
          type: boolean
          example: true
          description: 'Indicates whether the modification or reply was successful.'
    CancelCase:
      title: Cancel Case Request Payload
      required:
        - reason
      type: object
      properties:
        reason:
          maxLength: 4000
          minLength: 1
          type: string
          description: 'Enter any cancellation details.'
          example: 'This is a reason!'
    CancelCaseResponse:
      title: Cancel Case Request Response
      required:
        - result
      type: object
      properties:
        status:
          type: string
          example: 'OK'
          description: 'Status of the cancellation request.'
          enum:
            - OK
    Datetime:
      type: string
      example: "2023-08-29T04:01:43Z"
      format: date-time
      description: 'A datetime string with format YYYY-MM-DDTHH:mm:ss.sssZ.'
    RequestedTerminationDate:
      type: string
      example: "2026-09-01"
      format: date
      description: "Preferred termination date."
    TransactionIds:
      type: array
      minItems: 1
      maxItems: 20
      description: "List of transaction numbers such as invoice, credit memo or payment numbers."
      items:
        type: string
        example: "1234567890"
    Error:
      type: array
      items:
        required:
          - errorCode
          - errorMessage
        type: object
        properties:
          errorCode:
            type: string
            example: EQ-2017011
            description: Error Code
          errorMessage:
            type: string
            example: Error message
            description: Error Message
          details:
            type: string
            example: Error details
            description: Error Details
          correlationId:
            type: string
            example: 98f3f6fb1e127b1
            description: Correlation ID to trace the error back
          help:
            type: string
            example: URL to a help page for the corresponding errorCode
            description: URL to a help page for the corresponding errorCode
          additionalInfo:
            type: array
            items:
              $ref: '#/components/schemas/ErrorAdditionalInfo'
            description: Additional information about the error
    UnauthorizedError:
      type: array
      items:
        required:
          - errorCode
          - errorMessage
        type: object
        properties:
          correlationId:
            type: string
            example: 98f3f6fb1e127b1
            description: Correlation ID to trace the error back
          errorMessage:
            type: string
            example: 'Not authorized to execute this service'
            description: Error Message
          errorCode:
            type: string
            example: EQ-1610011
            description: Error Code
          details:
            type: string
            example: Error details
            description: Error Details
          help:
            type: string
            example: URL to a help page for the corresponding errorCode
            description: URL to a help page for the corresponding errorCode
          additionalInfo:
            type: array
            items:
              $ref: '#/components/schemas/ErrorAdditionalInfo'
            description: Additional information about the error
    ErrorAdditionalInfo:
      required:
        - property
        - reason
      type: object
      properties:
        property:
          type: string
          example: primaryId
          description: The property that caused the error
        reason:
          type: string
          example: primaryId is mandatory
          description: The reason why the property caused the error 