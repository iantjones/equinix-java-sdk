          example: "02s7z00000D30lZAAR"
          description: "Identifier of the email."
        createdDateTime:
          type: string
          format: date-time
          example: "2023-08-29T04:01:43.000Z"
          description: "Date and time the email was created."
        subject:
          type: string
          example: "Issue with device"
          description: "Subject of the email."
        author_name:
          type: string
          example: "Ali bin Carud"
          description: "Name of the email author."
        FromAddress:
          type: string
          example: "abc@equinix.com"
          description: "Email address of the email author."
        ToAddress:
          type: string
          example: "xyz@example.com"
          description: "Email address of the email recipient."
    EmailDetailsResponse:
      type: object
      properties:
        orderId:
          type: string
          example: "11768081"
          description: "Identifier of the order/case the email is associated with."
        createdDateTime:
          type: string
          format: date-time
          example: "2026-06-26T08:27:45.000+0000"
          description: "Date and time the email was created."
        subject:
          type: string
          example: "Portal Support Ticket: General Inquiry -  Case 11768081"
          description: "Subject of the email."
        email_content:
