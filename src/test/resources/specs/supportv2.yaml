      properties:
        contacts:
          type: array
          description: "Contact information."
          items:
            type: object
            required:
              - type
              - firstName
              - lastName
              - details
            properties:
              type:
                type: array
                minItems: 1
                maxItems: 4
                description: "Type of contact role. Our company will reach out to this person regarding information specific to their contact role."
                items:
                  type: string
                  example: "BILLING"
                enum:
                  - "BILLING"
                  - "PAYMENT"
                  - "PURCHASE_ORDER"
                  - "FINANCE"
              firstName:
