      scheme: bearer
      bearerFormat: JWT
      description: A JWT access token. Federated (OIDC) identities may obtain one via the STS token exchange endpoint at https://sts.eqix.equinix.com/v1/token. Customer Portal-based identities may obtain one via https://api.equinix.com/oauth2/v1/token
    clientCredentials:
      type: http
      scheme: basic
      description: HTTP Basic credentials (client ID and secret) used for service-to-service authentication within the Equinix platform. Not required for external API consumers.
    openIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://sts.eqix.equinix.com/.well-known/openid-configuration
