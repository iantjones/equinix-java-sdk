          description: Assets being monitored, keyed by level type (CAGE, CABINET, CIRCUIT)
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PowerAlertConfigurationAsset'
    PowerAlertCondition:
      type: object
      description: Defines the condition that triggers a power alert
      properties:
        conditionType:
          type: string
          description: The type of condition that triggers the alert (e.g., EXCEEDS, FALLS_BELOW)
          example: EXCEEDS
        eventType:
          type: string
          description: The power metric being monitored (e.g., CAGE_DRAW, CABINET_DRAW_TO_USABLE_KVA)
          example: CAGE_DRAW
        threshold:
          $ref: '#/components/schemas/PowerAlertThreshold'
    PowerAlertThreshold:
      type: object
      description: Threshold configuration for a power alert condition
      properties:
        unit:
          type: string
          description: Unit of measurement for the threshold value (e.g., %)
          example: "%"
        value:
          type: string
          description: Threshold value that triggers the alert
          example: "95"
        min:
          type: object
          nullable: true
          description: Minimum threshold value (used for range-based conditions)
          example: null
        max:
          type: object
          nullable: true
          description: Maximum threshold value (used for range-based conditions)
          example: null
    PowerAlertRecipient:
      type: object
      description: A recipient to be notified when a power alert condition is met
      properties:
        firstName:
          type: string
          description: First name of the recipient
          example: John
        lastName:
          type: string
          description: Last name of the recipient
          example: Doe
        sms:
          $ref: '#/components/schemas/PowerAlertContactMethod'
        email:
          $ref: '#/components/schemas/PowerAlertContactMethod'
    PowerAlertContactMethod:
      type: object
      description: A contact method (SMS or email) for alert notifications
      properties:
        value:
          type: string
          description: The contact value (phone number for SMS, email address for email)
          example: "user@example.com"
        enabled:
          type: boolean
          description: Whether this contact method is enabled for notifications
          example: true
    PowerAlertConfigurationAsset:
      type: object
      description: An asset included in a power alert configuration
      properties:
        assetId:
          type: string
          description: Unique identifier of the asset (e.g., cage, cabinet, or circuit ID)
          example: "SV5:01:A1234"
        assetName:
          type: string
          description: Display name of the asset
          example: "Customer Cage 1"
  examples:
    SearchRequest:
      summary: search request with multiple filters
      value:
        filter:
          and:
            - property: /status
              operator: "="
              values: [ACTIVE]
            - property: /asset/ibx
              operator: IN
              values: [MI1, NY1, WAW2]
            - property: /asset/assetUid
              operator: "="
              values: [MI1.arc-reactor]
            - property: /assetTagUid
              operator: "="
              values: [MI1.arc-reactor:alarm]
            - property: /assetTagDisplayName
              operator: "="
              values: [Arc Reactor Alarm]
            - property: /asset/assetType
              operator: "="
              values: [Arc Reactor]
            - property: /asset/assetClassification
              operator: "="
              values: [Mechanical]
            - property: /asset/assetUnderMaintenance
              operator: "="
              values: ["false"]
            - property: /state
              operator: "="
              values: [OPEN]
            - property: /configuration/thresholdType
              operator: "="
              values: [DIGITAL]
            - property: /configuration/conditionName
              operator: "="
              values: [ALARM]
            - property: activeProcessing.edgeCollectedOn
              operator: ">="
              values: [2000-03-25T04:03:06.000Z]
        pagination:
          offset: 0
          limit: 50
    ApiError400:
      summary: bad request
      value:
        - errorCode: EQ-50001400
          errorMessage: Bad request
          correlationId: dc1fe6b2-4ee1-11ed-bdc3-0242ac120002
          details: ""
          help: Please fix submitted payload
    ApiError401:
      summary: unauthorized error
      value:
        - errorDomain: api-platform
          errorTitle: Access Token expired
          errorCode: "401"
          developerMessage: Please pass a valid access token
          errorMessage: Access Token expired
    ApiError403:
      summary: authorization error
      value:
        - errorCode: EQ-5000002
          errorMessage: Forbidden
          correlationId: dc1fe6b2-4ee1-11ed-bdc3-0242ac120002
          details: Access is denied
    ApiError422:
      summary: wrong search filters
      value:
        - errorCode: EQ-5000023
          errorMessage: Unprocessable Entity
          correlationId: dc1fe6b2-4ee1-11ed-bdc3-0242ac120002
          details: The submitted payload does not meet validation criteria.
          help: Please fix submitted payload according to additionalInfo.
          additionalInfo:
            - constraintCode: AllowedSearchRequest
              root: searchRequest
              property: and[ 17 ]
              reason: Unsupported search field operator `customers.ucid` `LIKE`
    ApiError500:
      summary: internal error
      value:
        - errorCode: EQ-5000030
          errorMessage: Internal Server Error
          correlationId: dc1fe6b2-4ee1-11ed-bdc3-0242ac120002
          details: The server was unable to process the request due to an internal server error. Additional information can be found in server logs.
          help: Please contact vendor.
    CreateAlertConfigurationCommandExample:
      summary: Create a cage draw alert configuration
      value:
        accountNo: "123456"
        ibx: "SV5"
        section: "POWER"
        condition:
          conditionType: "EXCEEDS"
          eventType: "CAGE_DRAW"
          threshold:
            unit: "%"
            value: "95"
            min: null
            max: null
        recipients:
          - firstName: "John"
            lastName: "Doe"
            sms:
              value: "+1234567890"
              enabled: false
            email:
              value: "user@example.com"
              enabled: true
        assets:
          CAGE:
            - assetId: "SV5:01:A1234"
              assetName: "Customer Cage 1"
    UpdateAlertConfigurationCommandExample:
      summary: Update a cabinet draw alert configuration
      value:
        alertConfigurationUid: "9756a585-c3c1-4648-b2e1-7d8804912098"
        state: "ACTIVE"
        condition:
          conditionType: "EXCEEDS"
          eventType: "CABINET_DRAW_TO_USABLE_KVA"
          threshold:
            unit: "%"
            value: "2"
            min: "2"
            max: "3"
        recipients:
          - firstName: "John"
            lastName: "Doe"
            sms:
              value: ""
              enabled: false
            email:
              value: "user@equinix.com"
              enabled: true
        assets:
          CAGE:
            - assetId: "SG1:04:A1ER46"
              assetName: "SG1:04:A1ER46"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token generated from /v1/auth/satoken endpoint
  parameters:
    authorizationHeader:
      name: Authorization
      in: header
      description: The OAuth Bearer token. Please add the prefix 'Bearer ' before the token.
      required: true
      schema:
        type: string
      x-prefix: Bearer
