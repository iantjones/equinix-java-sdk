      tags:
        - Power Events
      summary: Pause a power alert configuration
      description: |
        Pauses an active power alert configuration. When paused, the configuration will not
        trigger any new power event alerts until it is resumed. The configuration remains
        accessible and can be resumed at any time.
      parameters:
        - name: alertConfigurationUid
          in: path
          description: Unique identifier (UUID) of the power alert configuration to pause
          required: true
          schema:
