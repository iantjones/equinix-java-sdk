    post:
      tags:
        - DCIM System Alert
      summary: System alerts search
      description: |
        This endpoint returns all system alerts in a paginated way
        allows narrowing returned results by submitting additional search filters.

        Allowed search filters:
        <table>
          <tr>
            <th>Property</th>
            <th>Operator</th>
            <th>Description</th>
          </tr>
          <tr>
            <td>/status</td>
            <td>=, IN</td>
            <td>Alert status, INACTIVE or ACTIVE</td>
          </tr>
          <tr>
            <td>/assetTagUid</td>
            <td>=, IN</td>
            <td>Asset tag point unique id, example: PA8A.CB-CRITICAL-DB2:tripped</td>
          </tr>
          <tr>
            <td>/assetTagDisplayName</td>
            <td>=, IN</td>
            <td>Active tag reading display value, example: ALARM</td>
          </tr>
          <tr>
            <td>/configuration/thresholdType</td>
            <td>=, IN</td>
            <td>Example: DIGITAL</td>
          </tr>
          <tr>
            <td>/configuration/conditionName</td>
            <td>=, IN</td>
            <td>Name given to the alarm condition. Example: ALARM</td>
          </tr>
          <tr>
            <td>/asset/ibx</td>
            <td>=, IN</td>
            <td>Name of the IBX for which data is being requested, example: PA8A</td>
          </tr>
          <tr>
            <td>/asset/assetUid</td>
            <td>=, IN, LIKE</td>
            <td>Asset unique ID, example: PA8A.CB-CRITICAL-DB2:tripped#DIGITAL:ALARM</td>
          </tr>
          <tr>
            <td>/activeProcessing/edgeCollectedOn</td>
            <td>=, >=, <=</td>
            <td>When tag reading was collected on source, example: 2022-09-23T13:40:53.449276Z</td>
          </tr>
          <tr>
            <td>/asset/assetUnderMaintenance</td>
            <td>=, IN</td>
            <td>Asset was under maintenance during alert processing, example: false</td>
          </tr>
          <tr>
            <td>/asset/assetType</td>
            <td>=, IN</td>
            <td>Indicates the template name for the asset, example: Circuit Breaker with Metering</td>
          </tr>
          <tr>
            <td>/asset/assetClassification</td>
            <td>=, IN</td>
            <td>The class of assets this asset belongs to. Asset classification is electrical or mechanical, example: Electrical</td>
          </tr>
        </table>

        Allowed search request sort options:
        - /status
        - /assetTagUid
        - /assetTagDisplayName
        - /configuration/thresholdType
        - /configuration/conditionName
        - /asset/ibx
        - /asset/assetUid
        - /activeProcessing/edgeCollectedOn
        - /asset/assetUnderMaintenance
        - /asset/assetType
        - /asset/assetClassification
      operationId: getAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              objectExample:
                $ref: '#/components/examples/SearchRequest'
      responses:
        '200':
          description: OK
