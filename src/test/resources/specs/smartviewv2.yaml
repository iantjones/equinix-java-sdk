      required:
        - operator
        - property
        - values
      type: object
      properties:
        property:
          type: string
          description: Field name
          example: status
        operator:
          type: string
          description: Condition used to compare the property and the value(s).
          example: "="
          enum: ["<=", ">=", "LIKE", "IN", "=", "!="]
        values:
          type: array
          description: Array of values to be compared with the field.
          minItems: 1
          maxItems: 2147483647
          items:
            type: string
    SearchFilter:
      type: object
      properties:
        and:
          type: array
          description: Array of search conditions.
          items:
            $ref: '#/components/schemas/SearchCondition'
        or:
          type: array
          description: Array of search conditions.
          items:
            $ref: '#/components/schemas/SearchCondition'
    SearchPagination:
      required:
        - limit
        - offset
      type: object
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Starting index of an item. First item is offset 0. Default value for offset is 0.
          example: 0
        limit:
          type: integer
          format: int32
          description: The maximum number of items to return starting from the index denotes by the offset item. Default value for limit is 20. Upper limit is 1000
          example: 20
    SearchRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/SearchFilter'
        pagination:
          $ref: '#/components/schemas/SearchPagination'
        sort:
          type: array
          description: Array of sorting conditions.
          items:
            $ref: '#/components/schemas/SearchSort'
    SearchSort:
      required:
        - property
      type: object
      properties:
        direction:
          type: string
          description: Direction of sorting. Default is ASC.
          example: DESC
          enum: [ASC, DESC]
        property:
          type: string
          description: Property used for sorting the data.
          example: /asset/ibx
    ApiError:
      required:
        - errorCode
        - errorMessage
      type: object
      properties:
        errorCode:
          type: string
          description: Application error code.
          example: EQ-1912306
        errorMessage:
          type: string
          description: Application error message
          example: Wrong customer id
        correlationId:
          type: string
          description: Correlation ID without any sensitive or meaningful information.
          example: b1ea22f8-34ae-6f67-4a33-b4f5ec99a1c6
        details:
          type: string
          description: More information on errors.
          example: Wrong value of ph#. Correct format is xxx-xxx-xxxx
        help:
          type: string
          description: >
            URL to a help page for the corresponding errorCode.
          example: https://docs.equinix.com/help/error/EQ-1912306
        additionalInfo:
          type: array
          description: >
            Contains application specific information for this error. The object inside this array can have any number of application specific properties.
            It has two reserved properties (they are optional):
            - property - This refers to the name of one of the following that is passed when invoking the API - query parameter, path parameter, JSON property of HTTP request body. It is used if there is a need to explicitly hightlight the name of the property.
            - reason - Error message specific to the corresponding property.
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
    ErrorAdditionalInfo:
      type: object
      properties:
        constraintCode:
          type: string
          description: Violated constraint name (simple class name). Can be used to render and localize the validation message by the consumer component such as a frontend application.
          example: InvalidFormat
        root:
          type: string
          description: The root bean. Multiple parameters can be validated during a single validation call, this parameter indicates the validated parameter name (example pagination, requestBody etc.).
          example: requestBody
        property:
          type: string
          description: Represents the JSON path of the property that failed validation. Can be used to map the failed property to the UI input.
          example: id
        reason:
          type: string
          description: Server side constraint violation message. Can be used as a translation fallback. The message will always be in English.
          example: Unable to deserialize input value to destination type.
