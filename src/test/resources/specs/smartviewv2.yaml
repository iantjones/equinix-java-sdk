openapi: 3.0.3
info:
  title: Equinix SmartView APIs
  version: "2.0.0"
  description: >
    Equinix Smart View is a comprehensive Data Center Infrastructure Management (DCIM) platform designed to facilitate advanced data collection related to customer deployments. The Smart View APIs provide insights into power, environmental, mechanical, and electrical data, allowing users to access information in near-real-time or from a historical perspective.


    Customers leverage Smart View APIs to:
      1. Monitor their assets in near-real-time through our Subscription API.
      2. Strategically plan power investments using the Power API.
      3. Gain a comprehensive understanding of the status of various assets that support their deployments.
    
    For more information, please visit the <a href="https://docs.equinix.com/smart-view/">Equinix Smart View Documentation Page</a>.
  termsOfService: https://www.equinix.com/about/legal/terms
  contact:
    name: Equinix API Support
    url: https://docs.equinix.com/api-support.htm
  license:
    name: Equinix Inc
    url: https://developer.equinix.com/agreement
servers:
  - url: https://api.equinix.com
    description: Equinix Inc
security:
  - BearerAuth: []
tags:
  - name: SmartView Environment APIs
    description: Empower yourself with Smart View Environment APIs. These APIs allow you to fetch current and trending environmental data (humidity and temperature) for your assets. You can retrieve data for a single sensor (by IBX code and sensor ID), for all sensors within an IBX (with pagination and sorting), or for a specific level value (IBX, zone, cage, cabinet, sensor). The APIs support both real-time and historical queries, enabling comprehensive monitoring and planning.
  - name: Streaming Subscription API
    description: IBX SmartView's subscription API allows users to subscribe to near real-time message feeds for events occurring within an IBX. Users can specify the types of messages to receive for each IBX. Users are able to view all subscriptions within their organization and update any subscription to modify the message feed being received.
  - name: SmartView Hierarchy APIs
    description: Empower yourself with Smart View Hierarchy APIs. Use these APIs to obtain location and power hierarchy for invoking other APIs. Given an account number, IBX code, and an asset Id, returns the corresponding location and power hierarchy of related assets. Required query parameters to obtain a valid response from these endpoints are account number and IBX code.
  - name: SmartView Assets APIs
    description: Empower yourself with Smart View Assets API. These provide the ability to consumers to list infra asset, fetch infra asset details, get affected customer assets based on asset id. Given an account number, IBX code, cage and asset classification (Electrical, Mechanical), information about the asset in a hierarchical structure comprising of the category, template and asset is returned. Given a category and a template, a list of assets is returned.
  - name: DCIM Power APIs
    description: Empower yourself with DCIM Power APIs. Use them to get current and trending information on power consumption by assets. These APIs return the power consumption info for all level values, given a customer account number, IBX and level type of ibx - cage, cabinet or circuit. Trending power data returns the kVA power draw and max allowed (%) for the given asset.
  - name: DCIM System Alert
    description: Empower yourself with IBX SmartView System Alert APIs to access information on the alarms, now \nknown as system alerts. Given a multiple criteria, this API retrieves all the system alerts.\nWe recommend customers utilize the POST call, however both calls are supported and functional.
  - name: Power Events
    description: Power Events provides a CRUD interface to manage power related alerts and states across your Equinix deployments, enabling customers to programmatically consume and manage power event data for their colocation footprint. It complements SmartView power APIs to support real‑time awareness and automation across IBXs, cages, cabinets, and circuits.
paths:
  /environment/v1/current:
    get:
      operationId: getCurrentEnvironmentData
      tags:
        - SmartView Environment APIs
      summary: Retrieve current environmental data
      description: The API returns environment information on temperature and humidity from inputs (ibx, zone, cage, sensor)
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: true
          schema:
            type: string
        - name: levelType
          in: query
          description: Level Type
          required: true
          schema:
            type: string
            enum: [IBX, ZONE, CAGE, SENSOR]
        - name: levelValue
          in: query
          description: Level Value is ibxCode, zoneUsID, cageUsID, sensorid for levelType ibx, zone, cage, sensor resp.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Environment Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentData'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /environment/v1/listCurrent:
    get:
      operationId: listCurrentEnvironmentData
      tags:
        - SmartView Environment APIs
      summary: Retrieve a list of environmental data
      description: The API returns environment info (humidity and temperature) for all the values for input level type IBX, ZONE, CAGE, SENSOR.
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: true
          schema:
            type: string
        - name: levelType
          in: query
          description: Level Type
          required: true
          schema:
            type: string
            enum: [IBX, ZONE, CAGE, SENSOR]
      responses:
        '200':
          description: Environment Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDataResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /environment/v1/trending:
    get:
      operationId: getTrendingEnvironmentData
      tags:
        - SmartView Environment APIs
      summary: Retrieve trending environmental data
      description: The API returns trending environment information (temperature and humidity) for input ibx, zone, cage, sensor.
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: true
          schema:
            type: string
        - name: dataPoint
          in: query
          description: Data point
          required: true
          schema:
            type: string
            enum: [temperature, humidity]
        - name: levelType
          in: query
          description: Level Type
          required: true
          schema:
            type: string
            enum: [IBX, ZONE, CAGE, SENSOR]
        - name: levelValue
          in: query
          description: Level Value is ibxCode, zone, cage, sensorid for levelType ibx, zone, cage, sensor resp.
          required: true
          schema:
            type: string
        - name: interval
          in: query
          description: Interval
          required: true
          schema:
            type: string
            enum: [reading, 1h, 1d]
        - name: fromDate
          in: query
          description: Date in long
          required: true
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          description: Date in long
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Trending Environment Data Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendingEnvironmentData'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v2/environmental/ibxs/{ibx}/sensors/readings:
    get:
      tags:
        - SmartView Environment APIs
      summary: Retrieve IBX sensors current readings
      description: Returns current environmental (temperature and humidity) sensor readings for the given IBX code in a paginated way.
      operationId: getSensorReadings
      parameters:
        - name: ibx
          in: path
          description: IBX where the sensor is located.
          required: true
          schema:
            type: string
            example: CH2
        - name: type
          in: query
          description: Type of sensor data to display, e.g. specifying 'HUMIDITY' means only sensor readings with HUMIDITY value will be included
          required: false
          schema:
            type: string
            example: HUMIDITY
        - name: zone
          in: query
          description: Zone name. Adding this parameter limits the query to sensors in the specified zone
          required: false
          schema:
            type: string
            example: CH2:1:06:ColoArea:1
        - name: offset
          in: query
          description: Results offset you want to retrieve (0..N)
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Number of records to retrieve per request.
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReadingsResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
  /smartview/v2/environmental/ibxs/{ibx}/sensors/{sensorId}/readings:
    get:
      tags:
        - SmartView Environment APIs
      summary: Retrieve Single sensor current value(s)
      description: Returns current environmental sensor readings such as temperature and humidity for the given sensor ID and IBX code.
      operationId: getSingleSensorReadings
      parameters:
        - name: ibx
          in: path
          description: IBX where the sensor is located.
          required: true
          schema:
            type: string
            example: SV2
        - name: sensorId
          in: path
          description: Id of sensor to read.
          required: true
          schema:
            type: string
            example: CH2.Environmental.MbusColo3Mod5.MOD35.C3TS03
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReading'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
  /smartview/v2/streaming/subscriptions:
    get:
      tags:
        - Streaming Subscription API
      summary: Retrieve all subscriptions
      description: This endpoint allows users to fetch details for all streaming subscriptions for a given organization.
      operationId: getAllSubscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
    post:
      tags:
        - Streaming Subscription API
      summary: Create subscription endpoint
      description: The endpoint allows users to define and create a new streaming subscription for a given organization.
      operationId: createSubscription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Location of created subscription. For Example - /smartview/v2/streaming/subscriptions/607460b4e4a78360425bca56
              schema:
                type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
  /smartview/v2/streaming/subscriptions/{id}:
    get:
      tags:
        - Streaming Subscription API
      summary: Retrieve subscription by ID
      description: This endpoint allows users to fetch details for a given streaming subscription for a given organization.
      operationId: getSubscriptionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
    put:
      tags:
        - Streaming Subscription API
      summary: Update subscription
      description: This endpoint allows users to modify and update an existing streaming subscription for a given organization. Request payload replaces current subscription.
      operationId: updateSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal server error
    delete:
      tags:
        - Streaming Subscription API
      summary: Delete subscription
      description: This endpoint allows users to delete and remove an existing streaming subscription for a given organization.
      operationId: deleteSubscriptionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
  /smartview/v2/streaming/subscriptionData/{subscriptionId}:
    get:
      tags:
        - Streaming Subscription API
      summary: Retrieve subscription data via REST
      description: This endpoint allows users to obtain API+ near real time data via a simple REST endpoint by employing subscription ID alongside other specified criteria, enabling a comprehensive and targeted approach to data retrieval. Subscription data endpoint works for all channels and not just REST channel.
      operationId: getSubscriptionData
      parameters:
        - name: subscriptionId
          in: path
          description: Subscription ID
          required: true
          schema:
            type: string
        - name: ibxs
          in: query
          description: Filter, set of IBXs
          required: false
          schema:
            type: array
            items:
              type: string
        - name: messageTypes
          in: query
          description: Filter, set of message types
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - ALARM
                - ALERT
                - ENVIRONMENTAL
                - METERED_POWER
                - POWER
                - TAG_POINT
        - name: streamIds
          in: query
          description: Filter, set of stream IDs
          required: false
          schema:
            type: array
            items:
              type: string
        - name: offset
          in: query
          description: Pagination, offset of the first item
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Pagination, limit of items returned
          required: false
          schema:
            type: integer
            format: int32
            default: 250
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionData'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error
  /smartview/v2/streaming/subscriptions/certificate:
    get:
      tags:
        - Streaming Subscription API
      summary: Get subscription certificate endpoint
      description: The Certificate endpoint allows users to retrieve certificates based on the specified channelType (AWS_IOT_CORE and WEBHOOK)
      operationId: getCertificate
      parameters:
        - name: channelType
          in: query
          required: true
          schema:
            type: string
            enum:
              - AWS_IOT_CORE
              - WEBHOOK
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCertificateResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal server error

  /smartview/v1/hierarchy/location:
    get:
      tags:
        - SmartView Hierarchy APIs
      operationId: getLocationHierarchy
      summary: Retrieve the Location Hierarchy
      description: |
        This endpoint returns the location hierarchy and provides data for invoking other APIs such as Environmental APIs that require location hierarchy information.
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Location Hierarchy Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v1/hierarchy/power:
    get:
      tags:
        - SmartView Hierarchy APIs
      operationId: getPowerHierarchy
      summary: Retrieve the Power Hierarchy
      description: |
        This endpoint returns the power hierarchy and provides data for invoking other APIs such as Power APIs that require power hierarchy information.
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Power Hierarchy Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v1/asset/list:
    get:
      tags:
        - SmartView Assets APIs
      operationId: getAsset
      summary: Retrieve assets list information
      description: >
        This endpoint returns information about asset in a hierarchical structure (category / template / asset) based on the input account number, IBX code, cage and asset classification (Electrical, Mechanical).
      parameters:
        - name: accountNo
          in: query
          description: customer account number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: ibx code
          required: true
          schema:
            type: string
        - name: classification
          in: query
          description: asset classification (Electrical, Mechanical)
          required: true
          schema:
            type: string
            enum: [Electrical, Mechanical]
        - name: cages
          in: query
          description: cage unique space id to be used to filter the assets list assumed to be all cage unique space id if no value is sent.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Asset Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsList'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v1/asset/details:
    get:
      tags:
        - SmartView Assets APIs
      operationId: getAssetDetails
      summary: Retrieve details for an asset
      description: >
        This endpoint returns information about asset details including tag points lists for a given asset identifier.
      parameters:
        - name: accountNo
          in: query
          description: customer account number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: ibx code
          required: true
          schema:
            type: string
        - name: classification
          in: query
          description: asset classification (Electrical, Mechanical)
          required: true
          schema:
            type: string
        - name: assetId
          in: query
          description: asset id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailsGetResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: postAssetDetails
      tags:
        - SmartView Assets APIs
      summary: Retrieve asset details
      description: >
        This endpoint returns information about assets details including the assets tag points list for the given multiple asset identifiers.
      requestBody:
        description: request schema
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDetailsRequest'
      responses:
        '200':
          description: Asset Details response object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailsResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v1/asset/tagpoint/affected-assets:
    get:
      tags:
        - SmartView Assets APIs
      operationId: getAffectedAsset
      summary: Retrieve affected customers assets hierarchy
      description: >
        This endpoint returns information regarding the affected assets of customers for a given asset identifier
      parameters:
        - name: accountNo
          in: query
          description: customer account number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: ibx code
          required: true
          schema:
            type: string
        - name: assetId
          in: query
          description: asset id
          required: true
          schema:
            type: string
        - name: classification
          in: query
          description: asset classification(Electrical, Mechanical)
          required: true
          schema:
            type: string
            enum: [Electrical, Mechanical]
      responses:
        '200':
          description: Affect Customer Circuits ( Cage > Cabinet > Circuit hierarchy )
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyNodeForAssetAPI'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v1/asset/search:
    get:
      tags:
        - SmartView Assets APIs
      operationId: searchAsset
      summary: Search for Assets matching the identifiers
      description: >
        This endpoint is used to search for assets using wild card search patterns matching the asset identifier.
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: true
          schema:
            type: string
        - name: searchString
          in: query
          description: Search String
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assets'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /smartview/v1/asset/tagpoint/current:
    get:
      tags:
        - SmartView Assets APIs
      operationId: getCurrentTagPoint
      summary: Retrieve latest tag point data
      description: >
        This endpoint fetches and provides the most recent tag point information for a given tag identifier.
      parameters:
        - name: accountNo
          in: query
          description: customer account number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: ibx code
          required: true
          schema:
            type: string
        - name: tagid
          in: query
          description: tag id is the unique identifier for the tag point
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the current tag point data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPointData'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: postCurrentTagPoint
      tags:
        - SmartView Assets APIs
      summary: Retrieve current tag points data
      description: >
        This endpoint fetches the latest read values for given tag points using given tag identifiers.
      requestBody:
        description: request schema
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentTagPointRequest'
      responses:
        '200':
          description: data for tag points based on input payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPointData'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /power/v1/current:
    get:
      operationId: getCurrentPowerData
      tags:
        - DCIM Power APIs
      summary: Retrieve current power consumption data
      description: >
        This powerData endpoint returns power consumption info (power consumption data with comparison data of current [% Kva] vs yesterday, lastWeek, lastMonth, lastQuarter) for input ibx, cage, cabinet, circuit.
      parameters:
        - name: accountNo
          in: query
          description: Customer Account Number
          required: true
          schema:
            type: string
        - name: ibx
          in: query
          description: IBX Code
          required: true
          schema:
            type: string
        - name: levelType
          in: query
          description: level type allowed value [ibx|cage|cabinet|circuit]
          required: true
          schema:
            type: string
            enum: [ibx, cage, cabinet, circuit]
        - name: levelValue
          in: query
          description: level value - ibx code, cage unique space id, cabinet unique space id, serial number for level type ibx, cage, cabinet, circuit respectively.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Valid Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerData'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerData_Error'
    post:
